<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <script src="comum.js"></script>
    <style>
{{FONTES}}
      :root { --fundo-claro: {{FUNDO_CLARO}}; --fundo-escuro: {{FUNDO_ESCURO}}; --texto: {{TEXTO}}; --destaque: {{DESTAQUE}}; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "{{TITULO}}", sans-serif; background: var(--fundo-claro); color: var(--texto); }
      /* Metade de cima (0 a 960): papel pontilhado de caderno, a assinatura no alto e o cartão de papel entre 220 e 870 */
      #pontos { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; background-image: radial-gradient(circle, var(--ponto) 2.4px, transparent 2.9px); background-size: 40px 40px; background-position: 20px 20px; }
      #cabeca { position: absolute; left: 0; right: 0; top: 150px; height: 44px; display: flex; align-items: center; justify-content: center; }
      #cabeca-texto { font-family: "{{CORPO}}", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cabeca); }
      #cartoes { position: absolute; left: 0; top: 220px; width: 1080px; height: 650px; }
      .cartao { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .papel {
        position: relative; width: 860px; box-sizing: border-box; padding: 72px 64px 60px; border-radius: 8px; background: var(--papel);
        box-shadow: 0 1px 2px color-mix(in srgb, var(--fundo-escuro) 10%, transparent), 0 22px 44px color-mix(in srgb, var(--fundo-escuro) 16%, transparent);
      }
      .fita { position: absolute; left: 330px; top: -24px; width: 200px; height: 50px; background: var(--fita); opacity: 0.85; transform: rotate(-3deg); }
      .titulo {
        margin: 0; text-align: center; text-wrap: balance; color: var(--tinta);
        font-family: "Caveat", cursive; font-weight: 700; font-size: calc(var(--k, 1) * 104px); line-height: 1.02;
      }
      .comlista .titulo { font-size: calc(var(--k, 1) * 86px); }
      .titulo em { position: relative; display: inline-block; font-style: normal; white-space: nowrap; color: var(--linha); }
      .sublinha { position: absolute; left: -10px; bottom: -14px; overflow: visible; }
      .lista { margin: calc(var(--k, 1) * 40px) 0 0; padding: 0 0 0 12px; list-style: none; display: flex; flex-direction: column; gap: calc(var(--k, 1) * 14px); }
      .item { display: flex; align-items: center; gap: 24px; }
      .quadrado { flex: 0 0 auto; display: block; overflow: visible; }
      .item-texto { position: relative; font-family: "Caveat", cursive; font-weight: 700; font-size: calc(var(--k, 1) * 66px); line-height: 1.05; color: var(--tinta); }
      .risco { position: absolute; left: -10px; top: 50%; margin-top: -14px; overflow: visible; }
      /* Metade de baixo (960 a 1920): o vídeo em toda a largura, com a sombra da borda do papel por cima */
      #janela { position: absolute; left: 0; top: 960px; width: 1080px; height: 960px; overflow: hidden; }
      #enquadramento { position: absolute; inset: 0; overflow: hidden; }
      .trecho { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{FOCO}}; }
      #borda { position: absolute; left: 0; right: 0; top: 960px; height: 18px; background: linear-gradient(color-mix(in srgb, var(--fundo-escuro) 22%, transparent), transparent); }
      /* A legenda corrida do Corte seco, sem caixa, dentro da metade do vídeo, embaixo e longe do rosto (1500 a 1650) */
      #legenda { position: absolute; left: 60px; right: 60px; top: 1500px; height: 150px; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="editor-chefe" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <div id="pontos"></div>
      <div id="cabeca"><div id="cabeca-texto">{{ASSINATURA}}</div></div>
      <div id="cartoes"></div>
      <div id="janela">
        <div id="enquadramento">
{{TRECHOS}}
        </div>
      </div>
      <div id="borda"></div>
      <div id="legenda"></div>
{{CAPA}}
{{EFEITOS}}
    </div>
    <script>
      const D = {{DADOS}};
      const EC = window.EditorChefe, novo = EC.novo, C = EC.iniciar(D.palavras), { TOTAL, TRECHOS, PAL } = C;
      const naEdicao = (t) => EC.naEdicao(t, "ini", TRECHOS, TOTAL);
      const tl = gsap.timeline({ paused: true });

      // Cores do papel (EC.coresPapelaria, as do painel branco do Motion dividido): tinta escura, traço e marcas na cor
      // destaque (escurecida se for clara demais); a assinatura no fundo claro
      const em = (x) => `rgb(${x.join(",")})`, raizCss = document.documentElement.style, P = EC.coresPapelaria(C);
      const TINTA = em(P.TEXTO), LINHA = em(P.LINHA), APAGADO = em(P.APAGADO);
      for (const [k, v] of [["papel", P.PAINEL], ["tinta", P.TEXTO], ["linha", P.LINHA], ["cabeca", P.CABECA], ["ponto", P.PONTO], ["fita", P.FITA]]) raizCss.setProperty(`--${k}`, em(v));

      // Traços desenhados à mão, feitos aqui para o Editor Chefe (nenhum desenho de terceiros), que se desenham com
      // pathLength 1 (stroke-dashoffset de 1 a 0)
      const NS = "http://www.w3.org/2000/svg";
      const svg = (pai, cls, id, w, h) => { const e = pai.appendChild(document.createElementNS(NS, "svg")); e.id = id; e.setAttribute("class", cls); e.setAttribute("width", w); e.setAttribute("height", h); e.setAttribute("viewBox", `0 0 ${w} ${h}`); return e; };
      const traco = (s, id, d, cor, g) => { const p = s.appendChild(document.createElementNS(NS, "path")); p.id = id; for (const [k, v] of Object.entries({ d, fill: "none", stroke: cor, "stroke-width": g, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": 1, "stroke-dashoffset": 1 })) p.setAttribute(k, v); return p; };
      // Linha ondulada de largura w (o sublinhado da palavra forte e o risco do item)
      const onda = (w, y, a) => `M2 ${y} C ${w * 0.22} ${y - a}, ${w * 0.38} ${y + a}, ${w * 0.55} ${y - a / 2} S ${w * 0.85} ${y - a}, ${w - 2} ${y - a / 3}`;

      // Monta depois das fontes (o cartão encolhe medindo a letra de mão); monta mesmo se uma fonte não carregar
      Promise.all([document.fonts.load(`700 86px "Caveat"`), document.fonts.load(`800 56px "{{TITULO}}"`)]).catch(() => {}).then(() => {
        const host = document.getElementById("cartoes");
        D.cartoes.forEach((c, i) => {
          const id = `cartao-${i + 1}`, ini = naEdicao(c.de), fim = D.cartoes[i + 1] ? naEdicao(D.cartoes[i + 1].de) : TOTAL, risco = c.marca === "risco";
          const el = host.appendChild(novo("div", "cartao", id)), papel = el.appendChild(novo("div", c.lista ? "papel comlista" : "papel", `${id}-papel`));
          const fita = papel.appendChild(novo("div", "fita", `${id}-fita`));
          const tit = papel.appendChild(novo("h2", "titulo", `${id}-titulo`));
          let forte = null;
          c.titulo.split(/(\*[^*]+\*)/).forEach((parte) => (parte.startsWith("*") ? (forte = tit.appendChild(novo("em", "", `${id}-forte`, parte.slice(1, -1)))) : tit.append(parte)));
          const itens = (c.lista ?? []).map((txt, k) => {
            const lista = papel.querySelector(".lista") ?? papel.appendChild(novo("ul", "lista", `${id}-lista`)), li = lista.appendChild(novo("li", "item", `${id}-item-${k + 1}`));
            const marca = svg(li, "quadrado", `${id}-item-${k + 1}-marca`, risco ? 30 : 64, 64);
            return { li, marca, texto: li.appendChild(novo("span", "item-texto", `${id}-item-${k + 1}-texto`, txt)) };
          });
          // Cartão mais alto que o espaço (650 px) encolhe a letra de 4 em 4%, até 64%
          let k = 1;
          while (papel.offsetHeight > 640 && k > 0.64) papel.style.setProperty("--k", (k -= 0.04).toFixed(2));
          const giro = i % 2 ? 1.1 : -1.4;
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, ini);
          tl.fromTo(papel, { opacity: 0, y: 60, rotation: giro - 5 }, { opacity: 1, y: 0, rotation: giro, duration: 0.45, ease: "back.out(1.6)" }, ini);
          tl.fromTo(fita, { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, ini + 0.25);
          // O título se escreve da esquerda para a direita; a palavra forte ganha o sublinhado à mão logo depois
          const escreve = Math.min(0.8, 0.25 + 0.012 * c.titulo.length);
          tl.fromTo(tit, { clipPath: "inset(-20% 100% -20% 0)" }, { clipPath: "inset(-20% 0% -20% 0)", duration: escreve, ease: "power1.inOut" }, ini + 0.2);
          if (forte) {
            const w = forte.offsetWidth + 20, s = svg(forte, "sublinha", `${id}-forte-sublinha`, w, 22);
            tl.to(traco(s, `${id}-forte-sublinha-traco`, onda(w, 12, 7), LINHA, 6), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, ini + 0.2 + escreve);
          }
          // A lista: os itens já escritos no cartão; cada um ganha o check (ou é riscado) no instante em que é dito
          const ts = c.lista ? EC.batidas(PAL, c.lista, ini, fim, { comTitulo: false, naUltima: true }).map((b) => b.t) : [];
          itens.forEach(({ li, marca, texto }, n) => {
            const nome = `${id}-item-${n + 1}`;
            tl.fromTo(li, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, ini + 0.45 + 0.1 * n);
            if (risco) {
              const ponto = traco(marca, `${nome}-ponto`, "M6 33 C 12 31, 19 31, 25 32", em(P.DETALHE), 6);
              ponto.setAttribute("stroke-dashoffset", 0);
              const w = texto.offsetWidth + 20, s = svg(texto, "risco", `${nome}-risco`, w, 28);
              tl.to(traco(s, `${nome}-risco-traco`, onda(w, 15, 6), LINHA, 6), { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, ts[n]);
              tl.to(texto, { color: APAGADO, duration: 0.25, ease: "power2.out" }, ts[n] + 0.1);
            } else {
              const caixa = traco(marca, `${nome}-quadrado`, "M10 12 C 24 9, 40 10, 54 11 C 55 25, 54 40, 53 54 C 38 55, 24 54, 10 53 C 9 39, 10 25, 10 12 Z", em(P.DETALHE), 4);
              caixa.setAttribute("stroke-dashoffset", 0);
              tl.to(traco(marca, `${nome}-check`, "M15 34 L28 47 L57 10", LINHA, 7), { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, ts[n]);
            }
          });
          tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, fim - 0.25);
        });

        // Legenda corrida do Corte seco, sem caixa, dentro do vídeo; traço na cor destaque nas palavras de ênfase (o montar.mjs escolhe)
        EC.legendaCorrida(tl, C, { fortes: D.fortes, familia: "{{TITULO}}", reforcar: {{VEU}} === 1 });
        if (D.aproximar) EC.aproximar(tl, D.aproximar);
        if (D.capa) EC.capa(tl, D.capa);
        window.__timelines["editor-chefe"] = tl;
      });
    </script>
  </body>
</html>
