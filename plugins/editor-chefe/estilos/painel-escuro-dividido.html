<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="comum.js"></script>
    <style>
{{FONTES}}
      :root { --fundo-claro: {{FUNDO_CLARO}}; --fundo-escuro: {{FUNDO_ESCURO}}; --texto: {{TEXTO}}; --destaque: {{DESTAQUE}}; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "{{TITULO}}", sans-serif; background: var(--fundo-escuro); color: var(--fundo-claro); }
      /* Metade de cima (0 a 960): o cabeçalho do Painel escuro fixo no alto (marca, filete e a numeração de cada cartão)
         e o título do cartão centrado entre 230 e 870, do maior tamanho que couber (de 88 a 120 px) */
      #cabeca, .cab-num { position: absolute; top: 150px; line-height: 30px; font-family: "{{CORPO}}", sans-serif; font-size: 24px; letter-spacing: 0.28em; text-transform: uppercase; color: color-mix(in srgb, var(--fundo-claro) 75%, var(--fundo-escuro)); }
      #cabeca { left: 64px; right: 64px; padding-bottom: 14px; border-bottom: 2px solid color-mix(in srgb, var(--fundo-claro) 80%, transparent); }
      .cab-num { right: 64px; }
      #cartoes { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; }
      .cartao { position: absolute; inset: 0; opacity: 0; }
      .tit { position: absolute; left: 64px; right: 64px; top: 230px; height: 640px; margin: 0; display: flex; align-items: center; font-family: "{{TITULO}}", sans-serif; font-weight: 800; font-size: 120px; line-height: 1.06; letter-spacing: -0.02em; }
      .tit em { font-style: normal; color: var(--destaque-legivel); }
      /* Metade de baixo (960 a 1920): o vídeo em toda a largura */
      #janela { position: absolute; left: 0; top: 960px; width: 1080px; height: 960px; overflow: hidden; }
      #enquadramento { position: absolute; inset: 0; overflow: hidden; }
      .trecho { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{FOCO}}; }
      /* A emenda: filete na cor de destaque e a legenda centrada nela (870 a 1050, meio em 960) */
      #emenda { position: absolute; left: 0; right: 0; top: 957px; height: 6px; background: var(--destaque-legivel); }
      #legenda { position: absolute; left: 48px; right: 48px; top: 870px; height: 180px; }
      .grupo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .grupo .caixa {
        display: flex; flex-wrap: wrap; justify-content: center; column-gap: 0.24em; max-width: 984px; padding: 14px 32px; border-radius: 16px;
        background: var(--fundo-escuro); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fundo-claro) 22%, transparent), 0 12px 30px color-mix(in srgb, var(--fundo-escuro) 45%, transparent);
        font-family: "{{TITULO}}", sans-serif; font-weight: 800; font-size: 58px; line-height: 1.15; color: var(--fundo-claro);
      }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="editor-chefe" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <div id="cartoes"></div>
      <div id="cabeca"></div>
      <div id="janela">
        <div id="enquadramento">
{{TRECHOS}}
        </div>
      </div>
      <div id="emenda"></div>
      <div id="legenda"></div>
{{CAPA}}
{{EFEITOS}}
    </div>
    <script>
      const D = {{DADOS}};
      const EC = window.EditorChefe, novo = EC.novo, C = EC.iniciar(D.palavras), { TOTAL, TRECHOS, CLARO, ESCURO, DESTAQUE } = C;
      const naEdicao = (t) => EC.naEdicao(t, "ini", TRECHOS, TOTAL);
      const tl = gsap.timeline({ paused: true });

      // Cartões: trecho literal da fala; *palavra* sai na cor destaque
      document.documentElement.style.setProperty("--destaque-legivel", EC.contraste(DESTAQUE, ESCURO) >= 3 ? DESTAQUE : `color-mix(in srgb, ${DESTAQUE} 55%, ${CLARO})`);
      document.getElementById("cabeca").textContent = D.nome;
      // O tamanho do título é medido com a fonte carregada; monta mesmo se ela não carregar
      document.fonts.load(`800 120px "{{TITULO}}"`).catch(() => {}).then(() => {
        const host = document.getElementById("cartoes");
        D.cartoes.forEach((c, i) => {
          const id = `cartao-${i + 1}`, ini = naEdicao(c.de), fim = D.cartoes[i + 1] ? naEdicao(D.cartoes[i + 1].de) : TOTAL;
          const el = host.appendChild(novo("div", "cartao", id));
          const num = el.appendChild(novo("div", "cab-num", `${id}-num`, `${String(i + 1).padStart(2, "0")} / ${String(D.cartoes.length).padStart(2, "0")}`));
          const tit = el.appendChild(novo("h2", "tit", `${id}-tit`)), frase = tit.appendChild(novo("span", "", `${id}-tit-texto`)); // um item só no flex: os espaços ficam
          c.titulo.split(/(\*[^*]+\*)/).forEach((parte) => (parte.startsWith("*") ? frase.appendChild(novo("em", "", "", parte.slice(1, -1))) : frase.append(parte)));
          for (let s = 120; s > 88 && tit.scrollHeight > tit.clientHeight; s -= 4) tit.style.fontSize = s - 4 + "px"; // título curto, letra grande
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, ini);
          tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, ini + 0.05);
          tl.fromTo(tit, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, ini + 0.15);
          tl.to(el, { opacity: 0, duration: 0.25, ease: "power2.in" }, fim - 0.25);
        });

        // Legenda em caixa escura na emenda; a palavra falada na cor destaque (clareada, se faltar contraste)
        EC.legendaEmCaixa(tl, C);
        if (D.capa) EC.capa(tl, D.capa);
        window.__timelines["editor-chefe"] = tl;
      });
    </script>
  </body>
</html>
