<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <script src="comum.js"></script>
    <style>
{{FONTES}}
      :root { --fundo-claro: {{FUNDO_CLARO}}; --fundo-escuro: {{FUNDO_ESCURO}}; --texto: {{TEXTO}}; --destaque: {{DESTAQUE}}; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "{{TITULO}}", sans-serif; background: var(--fundo-escuro); }
      #enquadramento { position: absolute; inset: 0; overflow: hidden; }
      .trecho { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{FOCO}}; }
      /* Caixinha: o visual da caixinha de perguntas do Instagram, não o da marca (faixa escura com a chamada, corpo branco
         com a pergunta). Topo logo abaixo do queixo (920, ou o do escolhas.json); cresce para baixo com o texto. Parada o vídeo inteiro. */
      #caixinha {
        position: absolute; left: 150px; width: 780px; top: 920px; border-radius: 24px; overflow: hidden;
        font-family: "Inter", sans-serif; font-weight: 700; text-align: center; letter-spacing: -0.01em;
      }
      #caixinha-chamada { background: #262B2E; color: #FFFFFF; font-size: 32px; line-height: 1.2; padding: 29px 36px; white-space: nowrap; }
      #caixinha-pergunta { background: #FFFFFF; color: #262626; font-size: 46px; line-height: 1.22; padding: 38px 48px 42px; text-wrap: balance; }
      /* Caixinha no alto, acima da cabeça (rosto grande e baixo demais para ela caber embaixo do queixo): mais larga e com letra maior */
      #caixinha.alto { left: 50px; width: 980px; }
      #caixinha.alto #caixinha-chamada { font-size: 40px; padding: 30px 44px; }
      #caixinha.alto #caixinha-pergunta { font-size: 62px; line-height: 1.2; padding: 40px 50px 46px; }
      /* Legenda viva entre a caixinha (+ 40 px) e y 1500; o script põe a faixa e o véu na altura certa */
      #veu-legenda { position: absolute; left: 0; right: 0; top: 1185px; height: 380px; opacity: {{VEU}}; background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--fundo-escuro) 62%, transparent) 28%, color-mix(in srgb, var(--fundo-escuro) 62%, transparent) 72%, transparent); } /* só com a faixa da legenda clara: o montar.mjs mede */
      #legenda { position: absolute; left: 90px; right: 90px; top: 1250px; height: 250px; }
      .grupo {
        position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; column-gap: 0.26em; opacity: 0;
        font-family: "{{TITULO}}", sans-serif; font-weight: 800; font-size: 82px; line-height: 1.1; color: var(--fundo-claro);
        text-shadow: 0 0 20px color-mix(in srgb, var(--fundo-escuro) 60%, transparent), 0 5px 12px color-mix(in srgb, var(--fundo-escuro) 70%, transparent);
      }
      .p { display: inline-block; padding: 0 0.14em; margin: 0 -0.14em; border-radius: 0.18em; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="editor-chefe" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <div id="enquadramento">
{{TRECHOS}}
      </div>
      <div id="veu-legenda"></div>
      <div id="legenda"></div>
      <div id="caixinha">
        <div id="caixinha-chamada"></div>
        <div id="caixinha-pergunta"></div>
      </div>
    </div>
    <script>
      const D = {{DADOS}};
      const EC = window.EditorChefe, novo = EC.novo, { TOTAL, PAL, CLARO, DESTAQUE, SOBRE_DESTAQUE } = EC.iniciar(D.palavras);
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id), px = (e, p) => parseFloat(getComputedStyle(e)[p]);

      // Caixinha: a chamada numa linha só (encolhe até caber); a pergunta em até 3 linhas e com lugar, abaixo da caixa, para
      // a folga de 40 px e duas linhas de legenda até y 1500 (encolhe de 2 em 2 px, até 30 px). A legenda ocupa a faixa
      // entre a base da caixinha + 40 px e y 1500, e o véu fica centrado nela. Se nem assim couber, avisa no hf check.
      // Medidas de layout (offset*, client*), que não mudam com a escala da prévia; refeitas quando a fonte carrega.
      const cx = $("caixinha"), ch = $("caixinha-chamada"), pg = $("caixinha-pergunta"), leg = $("legenda");
      const BASE = 1500, FOLGA = 40, LEGENDA = 181; // duas linhas da legenda (82 px, altura de linha 1,1)
      const alto = D.caixinha.lugar === "alto";
      cx.style.top = D.caixinha.topo + "px";
      if (alto) cx.classList.add("alto");
      ch.textContent = D.caixinha.chamada;
      pg.textContent = D.caixinha.pergunta;
      const medir = (final) => {
        ch.style.fontSize = pg.style.fontSize = "";
        const lado = px(ch, "paddingLeft"), livre = ch.clientWidth - 2 * lado;
        if (ch.scrollWidth - 2 * lado > livre) ch.style.fontSize = Math.floor((px(ch, "fontSize") * livre) / (ch.scrollWidth - 2 * lado)) + "px";
        const linhas = () => Math.round((pg.clientHeight - px(pg, "paddingTop") - px(pg, "paddingBottom")) / px(pg, "lineHeight"));
        // no alto: até 4 linhas, e a caixa termina antes de D.caixinha.fim (acima da cabeça); a legenda fica onde o montar pôs
        const sobra = alto ? () => D.caixinha.fim - (cx.offsetTop + cx.offsetHeight) : () => BASE - (cx.offsetTop + cx.offsetHeight + FOLGA) - LEGENDA;
        while ((linhas() > (alto ? 4 : 3) || sobra() < 0) && px(pg, "fontSize") > 30) pg.style.fontSize = px(pg, "fontSize") - 2 + "px";
        const topo = alto ? leg.offsetTop : cx.offsetTop + cx.offsetHeight + FOLGA, fim = alto ? topo + leg.offsetHeight : BASE;
        if (!alto) Object.assign(leg.style, { top: topo + "px", height: Math.max(0, BASE - topo) + "px" });
        $("veu-legenda").style.top = Math.round((topo + fim) / 2 - 190) + "px";
        if (final && sobra() < 0)
          console.error(alto ? `Editor Chefe: a caixinha no alto não cabe acima da cabeça (faltam ${Math.ceil(-sobra())} px). Encurte a pergunta ou ofereça outro estilo ao dono.`
            : `Editor Chefe: a caixinha não cabe com a legenda acima de ${BASE} px (faltam ${Math.ceil(-sobra())} px). Encurte a pergunta, confira o queixo ou ofereça outro estilo ao dono.`);
      };
      medir();
      // A HyperFrames espera essa promessa antes de gravar
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["editor-chefe-caixinha"] = document.fonts.load('700 100px "Inter"').catch(() => {}).then(() => medir(true));

      // Legenda viva: até 4 palavras por vez; a palavra falada ganha uma caixa na cor destaque
      const GRUPOS = EC.agrupar(PAL, 4, 18);
      GRUPOS.forEach((g, gi) => {
        const el = leg.appendChild(novo("div", "grupo", `grupo-${gi + 1}`));
        g.forEach((p, pi) => (p.el = el.appendChild(novo("span", "p", `grupo-${gi + 1}-p${pi + 1}`, p.txt))));
        const prox = GRUPOS[gi + 1], sai = Math.min(prox ? prox[0].ini : TOTAL, g[g.length - 1].fim + 0.6);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: Math.min(0.07, (sai - g[0].ini) / 2), ease: "none" }, g[0].ini);
        tl.set(el, { opacity: 0 }, sai);
        g.forEach((p, pi) => {
          tl.set(p.el, { backgroundColor: DESTAQUE, color: SOBRE_DESTAQUE, textShadow: "none" }, p.ini);
          tl.set(p.el, { backgroundColor: "rgba(0,0,0,0)", color: CLARO, textShadow: "" }, Math.min(g[pi + 1] ? g[pi + 1].ini : sai, p.fim + 0.25));
        });
      });
      if (D.aproximar) EC.aproximar(tl, D.aproximar);
      window.__timelines["editor-chefe"] = tl;
    </script>
  </body>
</html>
