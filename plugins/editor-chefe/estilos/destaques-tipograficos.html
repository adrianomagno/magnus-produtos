<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <script src="comum.js"></script>
    <script src="pecas.js"></script>
    <style>
{{FONTES}}
      :root { --fundo-claro: {{FUNDO_CLARO}}; --fundo-escuro: {{FUNDO_ESCURO}}; --texto: {{TEXTO}}; --destaque: {{DESTAQUE}}; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "{{TITULO}}", sans-serif; background: var(--fundo-escuro); }
      /* O vídeo cobre a tela inteira o tempo todo, sem moldura. Com uma frase ou peça acima da cabeça, ele aproxima ancorado
         no alto (o montar.mjs calcula, escala de 1 para cima): a cabeça desce e cresce, e nenhuma borda do vídeo entra na tela */
      #enquadramento { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 0; }
      .trecho { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{FOCO}}; }
      /* A frase em destaque: um cartão branco na faixa que o montar.mjs mediu (acima da cabeça ou, sem lugar ali, embaixo do
         queixo), encostado embaixo; o texto no escuro da marca e a palavra-chave no destaque (as cores do painel branco do Motion dividido) */
      #destaques { position: absolute; inset: 0; }
      .destaque { position: absolute; left: 0; right: 0; top: 0; opacity: 0; }
      .destaque-caixa { position: absolute; left: 90px; right: 90px; top: 240px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
      .destaque-frase {
        flex: none; margin: 0; max-width: 100%; box-sizing: border-box; padding: 14px 36px 22px; border-radius: 32px; background: #fff; box-shadow: 0 20px 44px rgba(0,0,0,.32); overflow: hidden;
        text-align: center; text-wrap: balance;
        font-family: "{{TITULO}}", sans-serif; font-weight: 800; font-size: 112px; line-height: 1.04; letter-spacing: -0.03em; color: var(--texto-frase);
      }
      .dw { display: inline-block; }
      .dw.chave { color: var(--chave); }
      /* A legenda de uma palavra por vez, na altura do peito (o desenho e as cores no pecas.js) */
      #legenda { position: absolute; left: 90px; right: 90px; top: 1310px; height: 170px; }
    </style>
  </head>
  <body>
    <div id="raiz" data-composition-id="editor-chefe" data-start="0" data-duration="{{DURACAO}}" data-width="1080" data-height="1920">
      <div id="enquadramento">
{{TRECHOS}}
      </div>
      <div id="destaques"></div>
      <div id="pecas"></div>
      <div id="pecas-canto"></div>
      <div id="legenda"></div>
{{CAPA}}
{{EFEITOS}}
    </div>
    <script>
      const D = {{DADOS}};
      const EC = window.EditorChefe, novo = EC.novo, C = EC.iniciar(D.palavras), { PAL } = C;
      const tl = gsap.timeline({ paused: true });
      const raizCss = document.documentElement.style, em = (x) => `rgb(${x.join(",")})`, K = EC.coresMotion(C);
      raizCss.setProperty("--texto-frase", em(K.TEXTO));
      raizCss.setProperty("--chave", em(K.LINHA));
      const TOPO = 240;

      // Monta depois da fonte (o tamanho da frase depende da medida); monta mesmo se ela não carregar
      Promise.all([document.fonts.load(`800 112px "{{TITULO}}"`), document.fonts.load(`{{PESO_CONDENSADA}} 112px "{{CONDENSADA}}"`)]).catch(() => {}).then(() => {
        const host = document.getElementById("destaques");
        D.destaques.forEach((x, n) => {
          const id = `destaque-${n + 1}`, y0 = x.y0 ?? TOPO, alt = x.y1 - y0, el = host.appendChild(novo("div", "destaque", id));
          el.style.height = x.y1 + 100 + "px";
          const caixa = el.appendChild(novo("div", "destaque-caixa", `${id}-caixa`));
          caixa.style.top = y0 + "px";
          if (x.x) Object.assign(caixa.style, { left: x.x[0] + "px", right: 1080 - x.x[1] + "px" }); // com a pílula do capítulo no canto
          caixa.style.height = alt + "px";
          if (x.lado === "baixo") caixa.style.justifyContent = "flex-start"; // embaixo do queixo, o cartão encosta nele
          const frase = caixa.appendChild(novo("p", "destaque-frase", `${id}-frase`));
          for (let i = x.de; i <= x.ate; i++) {
            if (i > x.de) frase.append(" ");
            const chave = i >= x.chave[0] && i <= x.chave[1], w = frase.appendChild(novo("span", chave ? "dw chave" : "dw", `${id}-p${i - x.de + 1}`, PAL[i].txt.replace(/[.,;:]+$/, "")));
            // cada palavra entra no instante em que é dita, subindo por dentro do cartão (recortado); a palavra-chave com um leve impulso
            if (chave) tl.fromTo(w, { opacity: 0, y: 18, scale: 1.12 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(2)" }, PAL[i].ini);
            else tl.fromTo(w, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.24, ease: "power3.out" }, PAL[i].ini);
          }
          // Frase (com o cartão) maior que a faixa encolhe de 2 em 2 px até 56 px. O cartão tem flex: none: com overflow hidden,
          // o flex deixaria ele encolher até a faixa, a medida nunca passaria dela e a segunda linha sairia recortada
          let s = 112;
          while (s > 56 && (frase.offsetHeight > alt || frase.scrollWidth > frase.clientWidth + 1)) frase.style.fontSize = (s -= 2) + "px";
          // o cartão branco entra um pouco antes da primeira palavra, crescendo de leve
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, Math.max(0, x.t - 0.12));
          tl.fromTo(frase, { scale: 0.94, y: 14 }, { scale: 1, y: 0, duration: 0.3, ease: "power3.out" }, Math.max(0, x.t - 0.12));
          tl.to(el, { opacity: 0, duration: 0.22, ease: "power2.in" }, x.sai);
        });

        // O vídeo aproxima 0,4 s antes de cada frase ou peça e volta depois dela (os intervalos e a escala, nunca abaixo de 1,
        // vêm do montar.mjs); só a escala muda, ancorada no alto, para nenhuma borda do vídeo entrar na tela
        for (const [a, b] of D.abre) {
          const ab = { scale: D.z }, fe = { scale: 1 };
          tl.fromTo("#enquadramento", fe, { ...ab, duration: 0.4, ease: "power2.inOut", immediateRender: false }, a);
          if (b >= C.TOTAL - 0.05) continue; // aproximado até o fim do vídeo
          tl.fromTo("#enquadramento", ab, { ...fe, duration: 0.45, ease: "power2.inOut", immediateRender: false }, b);
        }
        // As peças acima da cabeça, no tempo da fala (o plano vem do montar.mjs)
        EditorChefePecas.montar(tl, D.pecas ?? [], C, { titulo: "{{TITULO}}", cond: "{{CONDENSADA}}", condPeso: {{PESO_CONDENSADA}}, nome: D.nome });
        // Legenda de uma palavra por vez, sem as palavras que estão grandes na tela e fora da tela enquanto uma frase ou peça
        // está embaixo do queixo (D.semLegenda; na janela ela fica, e sobe para acima da cabeça quando a janela desce para
        // embaixo do queixo, D.legendaNoAlto); as palavras-chave na cor de destaque
        EditorChefePecas.legenda(tl, EC.semDestaques(PAL.map((p, k) => ({ ...p, k })), D.destaques), new Set(D.chaves ?? []), C.TOTAL, D.semLegenda ?? [], D.legendaNoAlto ?? []);
        if (D.aproximar) EC.aproximar(tl, D.aproximar);
        if (D.capa) EC.capa(tl, D.capa);
        window.__timelines["editor-chefe"] = tl;
      });
    </script>
  </body>
</html>
